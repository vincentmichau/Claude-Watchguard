# Night Watch - Cron Configuration for Automated Backups
# Install: sudo crontab -e (then paste these lines)

# Set environment variables
SHELL=/bin/bash
PATH=/usr/local/sbin:/usr/local/bin:/sbin:/bin:/usr/sbin:/usr/bin
MAILTO=admin@nightwatch.com

# Load environment variables from .env
# Note: Adjust the path to your installation directory
# DB_USER=nightwatch_user
# DB_PASSWORD=your_password
# DB_NAME=night_watch_db

# Daily backup at 2:00 AM
0 2 * * * /path/to/night-watch-app/scripts/backup-db.sh daily >> /var/log/night-watch-backup.log 2>&1

# Weekly backup every Sunday at 3:00 AM
0 3 * * 0 /path/to/night-watch-app/scripts/backup-db.sh weekly >> /var/log/night-watch-backup.log 2>&1

# Monthly backup on the 1st of each month at 4:00 AM
0 4 1 * * /path/to/night-watch-app/scripts/backup-db.sh monthly >> /var/log/night-watch-backup.log 2>&1

# Cleanup old logs (keep last 90 days)
0 5 * * 0 find /var/log -name "night-watch-*.log" -mtime +90 -delete

# Alternative schedules (commented out):
# Every 6 hours:
# 0 */6 * * * /path/to/night-watch-app/scripts/backup-db.sh hourly

# Every hour:
# 0 * * * * /path/to/night-watch-app/scripts/backup-db.sh hourly

# Twice daily (6 AM and 6 PM):
# 0 6,18 * * * /path/to/night-watch-app/scripts/backup-db.sh daily
